<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chris Plant | Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#0b0f1a;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:400px;text-align:center}
.mono{width:56px;height:56px;border-radius:50%;background:#002060;color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:.02em}
h1{margin:22px 0 6px;font-size:26px;font-weight:700;letter-spacing:-.01em}
p{margin:0;color:#4a5670;font-size:15.5px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid #c3cde3;border-radius:12px;outline:none;color:#0b0f1a;background:#fff}
input:focus{border-color:#002060;box-shadow:0 0 0 3px rgba(0,32,96,.15)}
button{font:inherit;font-size:16px;font-weight:600;padding:14px 16px;border:0;border-radius:12px;background:#002060;color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 14px 26px -16px rgba(0,32,96,.7)}
button[disabled]{opacity:.6;cursor:default;transform:none;box-shadow:none}
.msg{min-height:22px;margin-top:4px;font-size:14.5px;color:#a3182b}
.show{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#4a5670;position:static;width:auto;height:auto;clip:auto;cursor:pointer}
.show input{width:auto;padding:0}
.k{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#4a5670;margin:-2px 0 14px}
.req{margin-top:30px;padding-top:22px;border-top:1px solid #e3e8f2}
.req p{font-size:14.5px;margin-bottom:10px}
.btn2{display:inline-block;font-weight:600;font-size:15px;color:#002060;border:1px solid #002060;border-radius:12px;padding:12px 18px;text-decoration:none;transition:background .2s,color .2s}
.btn2:hover{background:#002060;color:#fff}
.ended input,.ended button{display:none}
</style>
</head>
<body>
<main class="box">
  <div class="mono" aria-hidden="true">CP</div>
  <h1>Chris Plant</h1>
  <p class="k">Operating Executive &nbsp;·&nbsp; COO &nbsp;·&nbsp; VP Operations</p>
  <p>This portfolio is private and shared by invitation with recruiters and hiring executives. Enter the password you were given to view it.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    <label class="show"><input id="sh" type="checkbox"> Show password</label>
    <button id="go" type="submit">View portfolio</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="req"><p>Don’t have access?</p><a class="btn2" id="req" href="#">Request access</a></div>
</main>
